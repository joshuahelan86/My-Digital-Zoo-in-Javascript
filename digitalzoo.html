<html>
<head>
    <title>My Digital Zoo Manager</title>

    <style>
        body {
            text-align: center;
            background-color: rgb(227, 248, 255);
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            color: rgb(255, 43, 15);
            font-size: 45px;
            font-weight: bold;
        }

        p {
            font-size: 20px;
            color: black;
            font-family: "Times New Roman", Times, serif;
        }

        #zoo {
            background-color: rgb(255, 193, 164);
            border: 2px solid black;
            box-shadow: 2px 2px 2px rgba(0, 0, 0, 0.452);
            width: 350px;
            margin: 15px auto;
            padding: 10px;
            border-radius: 8px;
        }

        .zone {
            font-size: 18px;
            margin: 5px auto;
            border: 2px solid black;
            padding: 10px;
            border-radius: 4px;
        }

        .zone:hover {
            background-color: rgb(250, 143, 94);
            color: rgb(46, 16, 16);
            cursor: pointer;
        }

        body.zoo-open .zone:hover {
            background-color: rgb(22, 109, 51);
            color: rgb(153, 236, 146);
            cursor: pointer;
        }

        button {
            background-color: rgb(3, 158, 54);
            color: rgb(170, 255, 170);
            font-size: 18px;
            padding: 10px;
            border: 2px solid black;
            border-radius: 8px;
            box-shadow: 2px 2px 2px rgba(0, 0, 0, 0.452);
            height: 50px;
            width: 170px;
            cursor: pointer;
        }

        button:hover {
            background-color: rgb(40, 228, 102);
            color: white;
        }

        button.clicked {
    background-color: rgb(150, 150, 150);
    color: white;
}   
    </style>
</head>

<body>

    <br>
    <br>

    <h1>My Digital Zoo Manager</h1>

    <p>
        Welcome to my digital zoo!
        Click the button below to manage the zoo.
    </p>

    <div id="zoo">

        <div class="zone">
            Zone 1: <span id="zone1"></span>
        </div>

        <div class="zone">
            Zone 2: <span id="zone2"></span>
        </div>

        <div class="zone">
            Zone 3: <span id="zone3"></span>
        </div>

    </div>

    <br>

    <button id="manageBtn" onclick="manageZoo()">
        Manage Zoo
    </button>

    <br>
    <br>

    <p id="zooinfo"></p>

    <script>

        function manageZoo() {

            document.getElementById("zone1").innerHTML = "Lion";

            document.getElementById("zone2").innerHTML = "Elephant";

            document.getElementById("zone3").innerHTML = "Panda";

            document.getElementById("zooinfo").innerHTML =
                document.title +
                " is now open to the public! Come and explore our animals!";

            document.getElementById("zoo").style.backgroundColor = "lightgreen";

            document.body.classList.add("zoo-open");

            document.getElementById("manageBtn").classList.add("clicked");
        }

    </script>

</body>
</html>
